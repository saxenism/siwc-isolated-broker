[package]
name = "siwc-isolated-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Credential-isolated ChatGPT plan broker primitives"
publish = false

[features]
default = []
experimental-login = ["dep:clap"]
experimental-serve = ["dep:clap"]
experimental-bridge = ["dep:clap"]

[[bin]]
name = "siwc-login"
path = "src/bin/siwc_login.rs"
required-features = ["experimental-login"]

[[bin]]
name = "siwc-serve"
path = "src/bin/siwc_serve.rs"
required-features = ["experimental-serve"]

[[bin]]
name = "siwc-agent-bridge"
path = "src/bin/siwc_agent_bridge.rs"
required-features = ["experimental-bridge"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
ed25519-dalek = "3.0.0"
getrandom = "0.3"
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
libc = "0.2.191"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
axum = "0.8"
rand = "0.8"
rsa = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
