[package]
name = "siwc-isolated-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Credential-isolated ChatGPT plan broker primitives"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
