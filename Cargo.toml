[package]
name = "siwc-isolated-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Credential-isolated ChatGPT plan broker primitives"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
libc = "0.2.191"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
axum = "0.8"
rand = "0.8"
rsa = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
